<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Yokkai Collec' — Ouverture vers le haut</title>
<style>
:root{
  --p: clamp(145px, min(36vw, 45svh), 268px);
  --foil-h: calc(var(--p) * 1.777);
  --ice:#a8d2ff;
  --bg:#070b13;
  --dur:6s;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background:
    radial-gradient(ellipse 31vw 30svh at 50% 45%,rgba(47,91,145,.19),transparent 100%),
    radial-gradient(ellipse 50vw 30svh at 50% 100%,rgba(51,90,135,.11),transparent 100%),
    linear-gradient(150deg,#060913,#080c14 58%,#05080e);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#e7f2ff;
}
.scene{height:100svh;min-height:310px;width:100%;display:grid;place-items:center;position:relative;isolation:isolate;perspective:1000px}
.scene::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 66%,rgba(0,0,0,.24) 100%);
  pointer-events:none
}
.ambient{
  position:absolute;width:min(540px,90vw);height:min(510px,86svh);
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(111,174,255,.12) 0%,rgba(38,89,173,.045) 32%,transparent 66%);
  opacity:.7;filter:blur(20px);pointer-events:none;
  animation:ambient-in 2.4s ease 0s both;
}
@keyframes ambient-in{0%{opacity:0;transform:scale(.85)}100%{opacity:.75;transform:scale(1)}}

/* Every moving layer stays within this single composited stage. */
.stage{
  position:relative;width:calc(var(--p)*1.65);height:calc(var(--foil-h)*1.18);
  transform-style:preserve-3d;
  z-index:1;
}
.floor{
  position:absolute;left:50%;bottom:2%;width:calc(var(--p)*1.2);height:28px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(140,197,255,.38),rgba(68,119,216,.10) 46%,transparent 75%);
  filter:blur(11px);opacity:0;
  animation:shadow-arrive 2.1s ease .25s both,shadow-release 1.7s ease 3.3s both;
}
@keyframes shadow-arrive{0%{opacity:0;transform:translateX(-50%) scale(.45)}100%{opacity:.78;transform:translateX(-50%) scale(1)}}
@keyframes shadow-release{0%{opacity:.78}100%{opacity:.20}}

.pack-position{
  position:absolute;top:50%;left:50%;width:var(--p);height:var(--foil-h);
  transform:translate(-50%,-50%);
}
.pack-entrance{
  position:absolute;inset:0;z-index:5;transform-style:preserve-3d;
  animation:pack-arrive 2.44s cubic-bezier(.19,.72,.3,1) 0s both, pack-idle 3.2s ease-in-out 4.05s infinite;
}
@keyframes pack-arrive{
  0%{opacity:0;transform:translate3d(0,54px,0) scale(.93) rotateZ(-3deg)}
  30%{opacity:1;transform:translate3d(0,-6px,0) scale(1.018) rotateZ(.6deg)}
  55%{opacity:1;transform:translate3d(0,0,0) scale(1) rotateZ(-.2deg)}
  72%{transform:translate3d(0,-5px,0) scale(1) rotateZ(.25deg)}
  100%{transform:translate3d(0,0,0) scale(1) rotateZ(0)}
}

/* Genuine top strip lifts away; the main foil pack remains open and visible. */
.foil-body,.foil-lid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform,opacity;transform-style:preserve-3d}
.foil-body{z-index:5;clip-path:polygon(0 11%,100% 11%,100% 100%,0 100%);
  animation:foil-body-open .88s cubic-bezier(.22,.76,.25,1) 2.89s both
}
@keyframes foil-body-open{
   0%{transform:translate3d(0,0,0) scaleX(1)}
   26%{transform:translate3d(0,4px,0) scaleX(1.008)}
   55%{transform:translate3d(0,11px,0) scaleX(1.027)}
   80%{transform:translate3d(0,10px,0) scaleX(.995)}
   100%{transform:translate3d(0,9px,0) scaleX(1)}
 }
.foil-lid{z-index:8;clip-path:polygon(0 0,100% 0,100% 11.5%,0 11.5%);
  transform-origin:50% 11%;
  animation:foil-peel 1.06s cubic-bezier(.18,.65,.22,1) 2.68s both;
}
@keyframes pack-idle{0%,100%{transform:translate3d(0,0,0) rotateZ(0deg)}50%{transform:translate3d(0,-6px,0) rotateZ(.23deg)}}
 @keyframes foil-peel{
   0%{opacity:1;transform:translate3d(0,0,0) rotateX(0deg) rotateZ(0deg)}
   17%{opacity:1;transform:translate3d(-1%,-1.6%,7px) rotateX(-8deg) rotateZ(-.6deg)}
   46%{opacity:1;transform:translate3d(3%,-9%,18px) rotateX(-24deg) rotateZ(2.8deg)}
   70%{opacity:.98;transform:translate3d(7%,-19%,24px) rotateX(-34deg) rotateZ(6deg)}
   100%{opacity:0;transform:translate3d(14%,-35%,10px) rotateX(-44deg) rotateZ(10deg)}
 }
.foil-body img,.foil-lid img{height:100%;width:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.foil-edge{
  position:absolute;z-index:9;left:9%;right:9%;top:10.6%;height:2px;
  border-radius:50%;background:linear-gradient(90deg,transparent,#b4dafa 10%,#f8ffff 48%,#78aaff 84%,transparent);
  box-shadow:0 0 7px rgba(212,236,255,.55);opacity:0;
  transform:scaleX(.08);animation:edge-release .72s cubic-bezier(.19,.72,.22,1) 2.68s both;
}
@keyframes edge-release{
  0%{opacity:0;transform:scaleX(.08)}
  26%{opacity:.95;transform:scaleX(.82)}
  50%{opacity:1;transform:scaleX(1)}
  100%{opacity:0;transform:scaleX(.95)}
}
.foil-opening{
  position:absolute;z-index:4;
  left:10%;right:10%;top:11%;height:1.5%;
  border-radius:0 0 12% 12%;
  background:linear-gradient(180deg,#02040a 0%,#07101c 60%,#081421 100%);
  box-shadow:none;
  filter:none;
  opacity:0;
  transform:scaleY(.15);
  transform-origin:50% 0;
  animation:open-mouth-clean .83s cubic-bezier(.22,.8,.22,1) 2.76s both;
}
@keyframes open-mouth-clean{
  0%{opacity:0;transform:scaleY(.12)}
  35%{opacity:.7;transform:scaleY(.78)}
  65%{opacity:.38;transform:scaleY(.7)}
  100%{opacity:0;transform:scaleY(.48)}
}

/* Subtle pale-blue metallic glint along the opened seal. */
.sheen-behind{
  position:absolute;z-index:1;left:50%;top:27%;width:84%;height:50%;
  transform:translate(-50%,-50%) scale(.72);
  background:radial-gradient(ellipse,rgba(196,227,255,.34),rgba(106,166,244,.08) 35%,transparent 70%);
  filter:blur(18px);opacity:0;
  animation:soft-opening-light .95s ease 2.76s both;
}
@keyframes soft-opening-light{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.62)}
  28%{opacity:.22}
  58%{opacity:.10;transform:translate(-50%,-50%) scale(.92)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.02)}
}

.replay{
 position:fixed;right:clamp(12px,2.5vw,28px);bottom:clamp(12px,3svh,30px);
 z-index:20;background:rgba(16,29,49,.56);border:1px solid rgba(173,211,255,.22);
 border-radius:999px;padding:9px 14px;color:#d1e7ff;
 font:500 12px Inter,system-ui,sans-serif;letter-spacing:.025em;
 cursor:pointer;transition:background .2s,border-color .2s;
 backdrop-filter:blur(10px);
}
.replay:hover{background:rgba(32,54,82,.86);border-color:rgba(191,223,255,.5)}
.replay:focus-visible{outline:2px solid #90c5ff;outline-offset:4px}
/* Hide stage while preparing a JS replay to restart all layers in one frame */
.scene:not(.running) .stage,.scene:not(.running) .ambient{opacity:0}
@media(max-width:640px){
 :root{--p:clamp(145px,min(55vw,38svh),224px)}
 .replay{font-size:11px;padding:8px 12px}
}
@media(max-height:500px){:root{--p:clamp(120px,min(31vw,47svh),210px)}.replay{bottom:8px}}
@media(prefers-reduced-motion:reduce){
 .scene *,.scene *::before,.scene *::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}
 .foil-body{display:block;transform:translateY(9px)}
 .foil-lid,.foil-edge{display:none}
 .foil-opening{display:block;opacity:.86;transform:scaleY(.65)}
 .pack-entrance{display:block;opacity:1;transform:none}
}

/* Production integration: adapt booster size to source image + available viewport. */
.scene {
  --pack-ratio: 1.7757; /* height / width; recalculated from loaded image */
  --foil-cut: 11%;       /* customizable opening height */
  --booster-accent: #a8d2ff;
  --p: min(268px, 57vw, calc(70svh / var(--pack-ratio)));
  --foil-h: calc(var(--p) * var(--pack-ratio));
  min-height: 0;
  height: 100svh;
}
.foil-body {clip-path: polygon(0 var(--foil-cut), 100% var(--foil-cut),100% 100%,0 100%)}
.foil-lid {clip-path: polygon(0 0,100% 0,100% calc(var(--foil-cut) + .5%),0 calc(var(--foil-cut) + .5%));transform-origin:50% var(--foil-cut)}
.foil-edge {top:calc(var(--foil-cut) - .4%)}
.foil-opening {top:var(--foil-cut)}
.foil-body img,.foil-lid img {width:100%;height:100%;object-fit:fill;image-rendering:auto;}
.ambient {
  background:radial-gradient(ellipse,
     color-mix(in srgb,var(--booster-accent) 14%,transparent) 0%,
     color-mix(in srgb,var(--booster-accent) 5%,transparent) 32%,transparent 66%);
}
.floor {
  background:radial-gradient(ellipse,
    color-mix(in srgb,var(--booster-accent) 45%,transparent),
    color-mix(in srgb,var(--booster-accent) 12%,transparent) 46%,transparent 75%);
}
.foil-edge{
  background:linear-gradient(90deg,transparent,
   color-mix(in srgb,var(--booster-accent) 70%,white) 14%,
   #fff 48%,var(--booster-accent) 84%,transparent);
}
/* No residue after detachment: all temporary opening effects must end at opacity 0. */
.sheen-behind,.foil-opening,.foil-edge {animation-fill-mode:both;}
@media (max-width:640px){
  .scene{--p:min(224px,58vw,calc(70svh / var(--pack-ratio)))}
}
@media (max-width:360px){
  .scene{--p:min(188px,60vw,calc(68svh / var(--pack-ratio)))}
}
@media (max-height:500px){
  .scene{--p:min(200px,39vw,calc(63svh / var(--pack-ratio)))}
  .ambient{filter:blur(12px)}
}
@media (max-height:320px){
  .scene{--p:min(150px,35vw,calc(59svh / var(--pack-ratio)))}
}
@media (prefers-reduced-motion:reduce){
  .sheen-behind,.foil-edge,.foil-opening{opacity:0!important}
}

</style>
</head>

  <button type="button" class="replay" id="replay" aria-label="Rejouer l'ouverture du booster">↻ Rejouer</button>
</div>
<script>
(() => {
  'use strict';
  const scene = document.getElementById('scene');
  const replayButton = document.getElementById('replay');
  const packBody = document.getElementById('packBody');
  const packLid = document.getElementById('packLid');
  let loadSequence = 0;
  let packRatio = 1.7757;
  let resizeFrame = 0;

  // A pixel fallback avoids CSS typed division/multiplication compatibility
  // differences on older mobile browsers, and honors the containing viewport.
  function updateLayout() {
    const vw = scene.clientWidth || window.innerWidth;
    const vh = scene.clientHeight || window.innerHeight;
    let limit = 268, widthFactor = .57, heightFactor = .70;
    if (vw <= 640) { limit = 224; widthFactor = .58; }
    if (vw <= 360) { limit = 188; widthFactor = .60; heightFactor = .68; }
    if (vh <= 500) { limit = 200; widthFactor = .39; heightFactor = .63; }
    if (vh <= 320) { limit = 150; widthFactor = .35; heightFactor = .59; }
    const width = Math.max(1, Math.min(limit, vw * widthFactor, vh * heightFactor / packRatio));
    scene.style.setProperty('--p', width.toFixed(2) + 'px');
    scene.style.setProperty('--foil-h', (width * packRatio).toFixed(2) + 'px');
  }
  function handleResize() {
    if (resizeFrame) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => { resizeFrame = 0; updateLayout(); });
  }
  window.addEventListener('resize', handleResize, {passive:true});
  if (window.visualViewport) window.visualViewport.addEventListener('resize', handleResize, {passive:true});

  function replay() {
    scene.classList.remove('running');
    // Force one style recalculation so all individual keyframes reset together.
    void scene.offsetWidth;
    scene.classList.add('running');
  }

  function setDimensions(img) {
    if (!img.naturalWidth || !img.naturalHeight) throw new Error('Booster image not decoded');
    packRatio = img.naturalHeight / img.naturalWidth;
    scene.style.setProperty('--pack-ratio', packRatio.toFixed(6));
    updateLayout();
  }

  async function ready(img) {
    if (typeof img.decode === 'function') {
      try { await img.decode(); } catch (_) { /* Fall through to dimensions check */ }
    }
    if (img.complete) {
      if (img.naturalWidth > 0) return img;
      throw new Error('Image de booster invalide ou inaccessible');
    }
    await new Promise((resolve, reject) => {
      img.addEventListener('load', resolve, {once:true});
      img.addEventListener('error', () => reject(new Error('Impossible de charger le booster')), {once:true});
    });
    return img;
  }

  /**
   * Accept a URL, or {boosterImage, tearAt, accentColor}.
   * - boosterImage: complete path or data URI for the pack image.
   * - tearAt: location of the top sealing edge as a percentage (6..18), default 11.
   * - accentColor: optional CSS color for the subtle environmental lighting.
   * Waits for the image to decode before restarting the reveal.
   */
  async function setYokkaiBooster(data = {}) {
    const opts = typeof data === 'string' ? {boosterImage:data} : (data || {});
    const url = opts.boosterImage || opts.packImage || opts.image || opts.imageUrl || opts.url;
    if (!url) { replay(); return true; }
    if (typeof url !== 'string') throw new TypeError('boosterImage doit être une URL ou une data URI');
    const seq = ++loadSequence;
    const candidate = new Image();
    candidate.decoding = 'async';
    candidate.src = url;
    await ready(candidate);
    if (seq !== loadSequence) return false; // a newer image request superseded this one

    const cut = Number(opts.tearAt);
    if (opts.tearAt !== undefined && Number.isFinite(cut))
      scene.style.setProperty('--foil-cut', `${Math.min(18, Math.max(6, cut))}%`);
    else scene.style.setProperty('--foil-cut', '11%');

    if (typeof opts.accentColor === 'string' && opts.accentColor.length < 100 &&
        typeof CSS !== 'undefined' && CSS.supports('color', opts.accentColor)) {
      scene.style.setProperty('--booster-accent', opts.accentColor);
    } else {
      scene.style.setProperty('--booster-accent', '#a8d2ff');
    }

    scene.classList.remove('running');
    packBody.src = url;
    packLid.src = url;
    setDimensions(candidate);
    await Promise.all([ready(packBody), ready(packLid)]);
    if (seq !== loadSequence) return false;
    replay();
    return true;
  }

  replayButton.addEventListener('click', replay);
  window.replayYokkaiBooster = replay;
  window.setYokkaiBooster = setYokkaiBooster;

  // Embedded default image: draw it before starting the first animation.
  packLid.src = packBody.src;
  Promise.all([ready(packBody), ready(packLid)]).then(() => {
    if (loadSequence !== 0) return;
    setDimensions(packBody);
    replay();
  }).catch(err => console.error('Yokkai Booster:', err));
})();
</script>
