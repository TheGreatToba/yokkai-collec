<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Yokkai Collec sharing image</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      background: #090714;
      color: #f2f0ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    img {
      position: absolute;
      width: 540px;
      height: 270px;
      object-fit: contain;
      left: 330px;
      top: 80px;
    }
    hr {
      position: absolute;
      left: 100px;
      top: 390px;
      width: 1000px;
      margin: 0;
      border: 0;
      border-top: 1px solid #625236;
    }
    h1 {
      position: absolute;
      top: 424px;
      width: 100%;
      margin: 0;
      font-size: 42px;
      line-height: 50px;
    }
    p {
      position: absolute;
      top: 498px;
      width: 100%;
      margin: 0;
      color: #a29dbe;
      font-size: 24px;
      line-height: 29px;
    }
    footer {
      position: absolute;
      top: 560px;
      width: 100%;
      color: #e8c26a;
      font-size: 22px;
      line-height: 26px;
    }
  </style>
  <body>
    <img src="../../public/assets/brand-logo-blue.png" alt="Yokkai Collec" />
    <hr />
    <h1>Summon. Collect. Complete.</h1>
    <p>Every card is a discovery.</p>
    <footer>yokkai-collec.com</footer>

</html>
